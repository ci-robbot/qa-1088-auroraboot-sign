---
name: 'Release images'

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: false # we never want to cancel a running job on release
jobs:
  build-ui:
    # Only riscv64 needs this (Node under QEMU crashed there before,
    # kairos-io/AuroraBoot#514). amd64/arm64 build their own UI inline via
    # Dockerfile's js stage.
    runs-on: 'ubuntu-26.04'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Upload UI artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: internal/ui/dist
          retention-days: 3 # was 1; see #545
  build-linux-amd64:
    runs-on: 'ubuntu-26.04'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ci-robbot/qa-1088-auroraboot:${{ github.ref_name }}-amd64
  build-linux-arm64:
    runs-on: 'ubuntu-26.04-arm'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          platforms: linux/arm64
          push: true
          tags: ghcr.io/ci-robbot/qa-1088-auroraboot:${{ github.ref_name }}-arm64
  build-linux-riscv64:
    # Reverts #545's disable; same runner, unchanged. See commit message
    # for why (the runner wasn't actually the problem).
    runs-on: 'ubuntu-26.04'
    needs: build-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download UI artifact
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: internal/ui/dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.riscv64
          build-args: |
            VERSION=${{ github.ref_name }}
          provenance: mode=max
          platforms: linux/riscv64
          push: true
          tags: ghcr.io/ci-robbot/qa-1088-auroraboot:${{ github.ref_name }}-riscv64
  build:
    needs:
      - build-linux-amd64
      - build-linux-arm64
      - build-linux-riscv64
    # riscv64 must not block the amd64/arm64 release (#545); included in
    # the manifest only if it succeeded this run.
    if: always() && needs.build-linux-amd64.result == 'success' && needs.build-linux-arm64.result == 'success'
    runs-on: ubuntu-26.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ghcr.io/ci-robbot/qa-1088-auroraboot
          # `latest` and the floating minor tag must only move for a real
          # release, so both are gated on the tag carrying no prerelease
          # suffix. Without the gate the default `latest=auto` promotes
          # `latest` on any tag push, prereleases included.
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}
          # `type=ref,event=tag` keeps the exact tag (`v0.27.0`), which is
          # what the default rules already published and what the helm
          # chart's appVersion and the per-arch tags use. The semver line
          # adds the floating `v0.27`, so a user can track patches within
          # a minor line.
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
      - name: Determine manifest sources
        id: sources
        run: |
          {
            echo "value<<SOURCES_EOF"
            echo "ghcr.io/ci-robbot/qa-1088-auroraboot:${{ github.ref_name }}-amd64"
            echo "ghcr.io/ci-robbot/qa-1088-auroraboot:${{ github.ref_name }}-arm64"
            if [ "${{ needs.build-linux-riscv64.result }}" = "success" ]; then
              echo "ghcr.io/ci-robbot/qa-1088-auroraboot:${{ github.ref_name }}-riscv64"
            fi
            echo "SOURCES_EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: int128/docker-manifest-create-action@v2
        id: build
        with:
          index-annotations: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
          sources: ${{ steps.sources.outputs.value }}
  # Only job with an OIDC token and no build step, so build code cannot sign.
  # The signed index includes riscv64 when it built, which runs on RISE runners.
  sign:
    needs:
      - build
    # build runs under always(), so without this a failed riscv64 job would
    # skip signing.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write  # QA: ghcr instead of quay creds
    env:
      IMAGE_NAME: ghcr.io/ci-robbot/qa-1088-auroraboot
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          # Same release as the kairos factory, so both use one signature format.
          cosign-release: "v3.1.4"
      - name: Sign the image index
        run: cosign sign --yes "${IMAGE_NAME}@${IMAGE_DIGEST}"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
